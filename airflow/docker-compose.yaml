services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER:?set AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME:-airflow}
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-env
      POSTGRES_HOST: host.docker.internal
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME:-airflow}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:?set AIRFLOW_ADMIN_USERNAME}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD}
    volumes:
      - ./dags:/opt/airflow/dags
      - ../dbt:/dbt
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        airflow users create
        --username "$${AIRFLOW_ADMIN_USERNAME}"
        --password "$${AIRFLOW_ADMIN_PASSWORD}"
        --firstname BDS
        --lastname Admin
        --role Admin
        --email bds@example.local || true

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      AIRFLOW__WEBSERVER__SECRET_KEY: bds-airflow-secret-key-2026
    volumes:
      - ./dags:/opt/airflow/dags
      - ../dbt:/dbt
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      <<: *airflow-env
      AIRFLOW__WEBSERVER__SECRET_KEY: bds-airflow-secret-key-2026
    volumes:
      - ./dags:/opt/airflow/dags
      - ../dbt:/dbt
    command: scheduler

volumes:
  airflow-postgres-data:
